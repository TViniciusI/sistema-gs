# Demo web (Next.js) a partir da raiz do monorepo.
# O app do técnico (Flutter) é outro site: veja apps/mobile/netlify.toml.
# No painel da Netlify (este site, escritório):
#   Base directory     → deixe vazio (raiz do repo)
#   Package directory  → apps/web
#   Framework          → Next.js
# Não preencha NEXT_PUBLIC_SUPABASE_* — a demo não usa banco.
# Opcional: NEXT_PUBLIC_CAMPO_URL com a URL do GS Campo na Netlify.

[build]
  # Next.js Runtime (@netlify/plugin-nextjs) define o publish.
  # No painel: Base directory vazio, Package directory = apps/web.
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--include=optional"
