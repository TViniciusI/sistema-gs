# 8 GB de RAM no Windows: o default do Flutter (-Xmx8G + 4G metaspace)
# deixa o Dart sem memória no kernel_snapshot (Out of memory).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.enableJetifier=true
